name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install sentinel-findings dependency
        run: pip install "sentinel-findings @ git+https://github.com/kkcyber2/sentinel-findings@main"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: CLI smoke
        run: |
          scanforge list
          scanforge run --target example.test --checks unfinished_markers \
            --option root=. --out /tmp/run.json
          python -c "import json;d=json.load(open('/tmp/run.json'));print(d['coverage'])"
