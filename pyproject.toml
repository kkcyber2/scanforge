[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanforge"
version = "1.0.0"
description = "Scan orchestration for ForgeGuard: plan, run checks with timeouts and isolation, aggregate canonical findings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kkcyber2" }]
keywords = ["security", "orchestration", "scanner", "findings"]
dependencies = ["sentinel-findings>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
scanforge = "scanforge.cli:main"

[tool.setuptools.packages.find]
include = ["scanforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
